name: Bump Homebrew tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v2.5.1"
        required: true

permissions:
  contents: read

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - name: Resolve tag
        id: meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${RELEASE_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve a tag"
            exit 1
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Tag '$TAG' does not look like vX.Y.Z"; exit 1 ;;
          esac
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"  >> "$GITHUB_OUTPUT"

      - name: Compute source tarball checksum
        id: sha
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          URL="https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
          curl -fsSL --retry 3 --retry-delay 5 -o source.tar.gz "$URL"
          echo "sha256=$(shasum -a 256 source.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Check out tap
        uses: actions/checkout@v7
        with:
          repository: Humblemonk/homebrew-shurectl
          token: ${{ secrets.TAP_TOKEN }}
          path: tap
          persist-credentials: true

      - name: Rewrite formula
        env:
          NEW_URL: ${{ steps.sha.outputs.url }}
          NEW_SHA: ${{ steps.sha.outputs.sha256 }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          cd tap
          FORMULA="Formula/shurectl.rb"
          test -f "$FORMULA" || { echo "::error::$FORMULA not found"; exit 1; }

          sed -E \
            -e "s|^(  url \").*(\")$|\1${NEW_URL}\2|" \
            -e "s|^(  sha256 \").*(\")$|\1${NEW_SHA}\2|" \
            "$FORMULA" > "$FORMULA.tmp" && mv "$FORMULA.tmp" "$FORMULA"

          grep -q "$TAG" "$FORMULA" \
            || { echo "::error::url rewrite did not take"; exit 1; }
          grep -q "$NEW_SHA" "$FORMULA" \
            || { echo "::error::sha256 rewrite did not take"; exit 1; }

      - name: Validate formula
        run: |
          brew style tap/Formula/shurectl.rb

      - name: Commit and push
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/shurectl.rb
          if git diff --cached --quiet; then
            echo "Formula already current, nothing to push."
            exit 0
          fi
          git commit -m "chore: bump shurectl to ${VERSION}"
          git push
