[package]
name = "shurectl"
version = "2.15.0"
edition = "2024"
rust-version = "1.88"
default-run = "shurectl"
description = "shurectl — TUI configurator for Shure USB audio interfaces and microphones"
license = "GPL-3.0-only"
repository = "https://github.com/Humblemonk/shurectl"
keywords = ["shure", "motiv", "microphone", "tui", "audio-interface"]
categories = ["command-line-utilities", "hardware-support", "multimedia::audio"]

[[bin]]
name = "shurectl"
path = "src/main.rs"

[[bin]]
name = "shurectl-probe"
path = "src/bin/probe.rs"
required-features = ["probe"]

[[test]]
name = "e2e"
path = "tests/e2e.rs"
required-features = ["qa"]

[features]
probe = []
# Maintainer and CI only: `--qa` and `--fake-device`, the headless JSON-lines
# driver used by tests/e2e.rs and agent QA passes. Never enabled for releases.
qa = []

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.18.2"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs-next = "2.0"
serde_json = "1"
# Firmware archive lookup for the Info tab (firmware.rs). rustls, so no OpenSSL;
# gzip shrinks the reply from ~3.4 KB to ~0.5 KB.
ureq = { version = "3.4", default-features = false, features = ["rustls", "gzip"] }

[target.'cfg(unix)'.dependencies]
# libc is used solely for the stderr suppressor in meter.rs (dup/dup2).
# WASAPI on Windows does not spam stderr during device probing, so it is not needed there.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.4.1", default-features = false, features = ["linux-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.4.1", default-features = false, features = ["macos-shared-device"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Default features pull in the Windows HID backend (setupapi) via the bundled hidapi C library.
hidapi = "2.4.1"

[dev-dependencies]
portable-pty = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
